spring.application.name=diploma-generator

server.port=8081

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.queue.name=queue_diploma
rabbitmq.exchange.name=exchange.diploma
rabbitmq.routing.key=diploma

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.platform=postgres
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.cache.type=redis
spring.cache.host=${SPRING_CACHE_HOST}
spring.cache.port=6379

minio.url=${MINIO_URL}
minio.access.key=minioadmin
minio.secret.key=minioadmin
minio.bucket.name=diplomas

