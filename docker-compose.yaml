services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-postgres/ddl.sql:/docker-entrypoint-initdb.d/ddl.sql
    ports:
      - "5432:5432"
    restart: always

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z-cpuv1
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./diplomas:/data
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq  # Volume para persistir as mensagens
    restart: always

  diploma-api:
    build:
      context: ./diploma-api
      dockerfile: Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - rabbitmq
    expose:
      - "8080"
    networks:
      - default
      - nginx_default
    restart: always

  diploma-generator:
    build:
      context: ./diploma-generator
      dockerfile: Dockerfile
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_CACHE_HOST=redis
      - MINIO_URL=http://minio:9000
    depends_on:
      - redis
      - minio
      - rabbitmq
    expose:
      - "8081"
    restart: always
      
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: always

  nginx:
    image: nginx:1-alpine
    ports:
      - 8090:80
    networks:
      - default
      - nginx_default
    volumes:
      - ./front/nginx:/etc/nginx/conf.d:ro
      - ./front/html:/usr/share/nginx/html
    restart: always

volumes:
  pgdata:
  mysqldata:
  rabbitmq_data:

networks:
  nginx_default:
    external: true
